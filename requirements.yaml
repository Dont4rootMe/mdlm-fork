name: ai_lerobot_v3
channels:
  - nvidia
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # Базовая среда
  - python=3.10
  - pip
  - cuda-toolkit=12.4        # даёт nvcc и dev headers/libs внутрь env
  - ninja                    # нужен для быстрой сборки flash-attn

  # PyTorch стек с CUDA 12.4 под Hopper (H100)
  - pytorch=2.5.1
  - torchvision=0.20.1
  - torchaudio=2.5.1
  - pytorch-cuda=12.4        # подтягивает cudart/cuBLAS/cuDNN 12.4 совместимый с pytorch

  # Интерактив/ноутбуки из твоего файла
  - jupyter=1.0.0
  - notebook=7.1.1

  # Остальные зависимости из твоего исходного requirements.yaml (pip-раздел) :contentReference[oaicite:2]{index=2}
  - pip:
      - datasets==2.18.0
      - einops==0.7.0
      - fsspec==2024.2.0
      - git-lfs==1.6
      - h5py==3.10.0
      - hydra-core==1.3.2
      - ipdb==0.13.13
      - lightning==2.2.1
      - mauve-text==0.4.0
      - nvitop==1.3.2
      - omegaconf==2.3.0
      - packaging==23.2
      - pandas==2.2.1
      - rich==13.7.1
      - seaborn==0.13.2
      - scikit-learn==1.4.0
      - timm==0.9.16
      - transformers==4.38.2
      - wandb==0.13.5
      # Важно: я ИСКЛЮЧАЮ triton==2.2.0.
      # Причина: PyTorch 2.5.x приносит свой совместимый Triton под H100.
      # Жёсткая принудительная установка старого внешнего triton==2.2.0
      # часто ломает ядра и матмулы на Hopper.
      # Если тебе критично зафиксировать triton==2.2.0 вручную,
      # ты можешь добавить эту строку обратно сюда, но это риск.
