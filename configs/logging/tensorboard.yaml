# Configuration for TensorBoard logging
use_tensorboard_logger: true  # Use TensorBoard for logging
use_json_logger: false  # Disable JSON logger
use_wandb_logger: false  # Disable W&B logger

# TensorBoard specific settings
# Save directory and experiment name are configured in config.yaml:
#   - tensorboard_logs: path where to save TensorBoard logs
#   - experiment_name: name of the experiment run
# Logs will be saved to: {tensorboard_logs}/{experiment_name}/version_X/

